name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Coverage
        run: make cover
      - name: Vet
        run: go vet ./...
      - name: Fuzz (short)
        run: go test -fuzz=. -fuzztime=10s ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install tools
        run: make tools
      - name: Security scan
        run: make security
