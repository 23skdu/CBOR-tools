name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t cbor-tool:scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cbor-tool:scan
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
