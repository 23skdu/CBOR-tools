name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t cbor-tool:scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cbor-tool:scan
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
